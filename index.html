    <!-- Apply the saved theme before first paint to avoid a flash of the wrong theme. Dark is the brand default. -->
    <script>
      (function () {
        try {
          var t = localStorage.getItem("theme");
          if (t === "light") {
            var r = document.documentElement;
            r.classList.remove("dark");
            r.classList.add("light");
          }
        } catch (e) {}
      })();
    </script>
